<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official privacy and support information for IT Support Lab.">
  <title>IT Support Lab — Privacy &amp; Support</title>
  <style>
    :root { color-scheme: dark; --navy: #07162f; --panel: #10284d; --blue: #4f8ff7; --teal: #65d6ca; --text: #f6f9ff; --muted: #c8d6ec; --line: #28466f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #123968 0, var(--navy) 48%); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--teal); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; border: 2px solid var(--teal); border-radius: 16px; font-size: 24px; }
    .card { margin-top: 28px; padding: clamp(24px, 5vw, 44px); background: rgba(16,40,77,.94); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 22px 55px rgba(0,0,0,.28); }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.8rem); line-height: 1.05; }
    p { color: var(--muted); }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin: 30px 0; }
    a.button { display: flex; min-height: 52px; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 14px; background: var(--blue); color: white; font-weight: 800; text-decoration: none; text-align: center; }
    a { color: #8db7ff; }
    footer { margin-top: 32px; color: var(--muted); font-size: .92rem; }
    @media (max-width: 480px) { main { padding: 32px 0; } nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">✓</span><span>IT Support Lab</span></div>
    <section class="card">
      <h1>Privacy &amp; Support</h1>
      <p>Official public information for IT Support Lab, a bilingual educational app for practical entry-level IT support training.</p>
      <nav aria-label="Public information">
        <a class="button" href="privacy.html">Privacy Policy</a>
        <a class="button" href="support.html">Support</a>
      </nav>
      <p>Contact: <a href="mailto:itsupportlab.support@gmail.com">itsupportlab.support@gmail.com</a></p>
    </section>
    <footer>Developer: Alexeis Borroto</footer>
  </main>
</body>
</html>
